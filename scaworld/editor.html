<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./editor.css">
</head>

<body>
    <!-- Panel 1: Sidebar (left, full height minus timeline) -->
    <aside class="html-main panel" id="sidebar">
        <div class="resize-handle"></div>
        <div class="panel-header">
            <span class="panel-title">Animation Data</span>
        </div>
        <div class="panel-content">
            <div id="parts-data"> </div>
        </div>
    </aside>

    <!-- Right: Main content (flex column, takes remaining space) -->
    <div id="main-content">
        <!-- Panel 2: Animation Controls -->
        <main class="panel" id="panel-canvas">
            <div class="panel-header">
                <span class="panel-title">Animation Controls</span>
            </div>
            <div class="panel-content">
                <div class="control-block">
                    <label for="ddl-animations">Animation: </label>
                    <select id="ddl-animations"></select>
                </div>
                <div class="control-block">
                    <button type="button" id="btn-new-animation">Nova Animação</button>
                    <button type="button" id="btn-baixar-json">Salvar</button>
                </div>
                <br>
                <div class="control-block">
                    <label><input id="chk-pause" type="checkbox"> Pause</label>
                </div>
                <div class="control-block">
                    <label style="width: 150px; display: inline-block;">Animation Frame (<span
                            id="animation-frame-value"></span>)</label>
                    <input id="range-animation-frames" type="range" min="0" max="0" step="1">
                </div>
                <div class="control-block">
                    <label for="animation-duration">Duration (frames): </label>
                    <input type="number" id="animation-duration" min="0" style="width: 80px;">
                </div>
                <div class="control-block">
                    <label for="animation-speed">Animation Speed: </label>
                    <input type="number" id="animation-speed" min="0" style="width: 80px;">
                </div>
                <div class="control-block">
                    <label for="canvas-zoom">Canvas Zoom: </label>
                    <input type="number" id="canvas-zoom" min="0.1" max="10" step="0.1" value="2" style="width: 80px;">
                </div>
            </div>
            <div class="panel-resize-handle"></div>
        </main>

        <!-- Panel 3: Viewport (canvas) -->
        <div class="panel" id="panel-viewport" style="height: 250px;">
            <div class="panel-header">
                <span class="panel-title">Viewport</span>
            </div>
            <div class="panel-content">
                <div class="background-ambiente">
                    <div class="html-canvas layer">
                        <div class="element floor"></div>
                        <canvas id="gameCanvas" class="element canvas"></canvas>
                        <canvas id="uiCanvas" class="element canvas"></canvas>
                        <div class="element fps"></div>
                        <div class="element time"></div>
                        <div class="element size"></div>
                    </div>
                </div>
            </div>
            <div class="panel-resize-handle"></div>
        </div>

        <!-- Panel 4: Part Textures -->
        <div class="panel" id="panel-textures">
            <div class="panel-header">
                <span class="panel-title">Part Textures</span>
            </div>
            <div class="panel-content">
                <div id="texture-selects-container" style="overflow-x: auto;max-height: 308px;"></div>
            </div>
        </div>

        <!-- Panel 5: Timeline (bottom, full width) -->
        <div class="panel" id="panel-timeline" style="height: 220px;">
            <div class="panel-header">
                <span class="panel-title">Timeline</span>
            </div>
            <div class="panel-content">
                <div class="timeline-controls">
                    <label for="timeline-frames-show">Frames to show: </label>
                    <input type="number" id="timeline-frames-show" min="10" max="500" value="50" style="width: 60px;">
                    <label style="margin-left: 16px;">
                        <input type="checkbox" id="chk-scroll-with-playhead"> Scroll with playhead
                    </label>
                </div>
                <div class="timeline-wrapper" id="timeline-wrapper">
                    <div class="timeline-ruler" id="timeline-ruler"></div>
                    <div class="timeline-nodes" id="timeline-nodes"></div>
                    <div class="timeline-playhead" id="timeline-playhead"></div>
                </div>
            </div>
            <div class="panel-resize-handle"></div>
        </div>

        <div class="panel">
            <div class="panel-content">
                <div id="debug">
                    <canvas id="debugAtlasSection"></canvas>
                    <canvas id="debugAtlas"></canvas>
                </div>
                <canvas id="debug-canvas"></canvas>
                <div id="show-emotes"></div>
            </div>
        </div>
    </div>

    <script type="module">
        //@ts-check
        import engine from './js/engine.js';
        import world from './js/world.js';
        import { atlases, charDefinitions, propsDefinition } from './js/atlasManager.js';
        import charAnimatior from './js/systems/characterAnimator.js';
        import character from './js/elements/character.js';
        import editor from './js/editor.js';

        const debug = /** @type {HTMLCanvasElement} */ (document.getElementById('debugAtlas'));
        const ctx = /** @type {CanvasRenderingContext2D} */ debug.getContext('2d');

        const ddlAtlas = document.getElementById('ddlAtlas');
        const ddlAtlasSection = document.getElementById('ddlAtlasSection');

        engine.resizeCanvas(100, 100);
        const lblFps = document.getElementsByClassName('fps')[0];
        const canvas = engine.canvas;
        const gl = engine.gl;
        const programData = engine.programData;

        const gameCanvas = document.getElementById('gameCanvas');

        console.log(atlases);

        window.world = world;

        /** @param {string} url */
        async function loadJSON(url) {
            const r = await fetch(url);
            const text = await r.text();
            return JSON.parse(text);
        }

        (async () => {
            console.log(`Canvas Width: ${canvas.width} / Height: ${canvas.height}`);

            let floatingTime = 0;

            const {
                propCenarioFBO,
                cenarioFBO,
                backgroundFBO,
                lightFBO,
                charDrawer,
                propDrawer,
                backgroundDrawer,
                cenarioDrawer,
                rioDrawer,
                rawDrawer,
                dyPropDrawer,
                lightDrawer,
            } = await world.setup(gl);

            engine.on('everySecond', () => {
                lblFps.innerHTML = engine.getFramerate();
                debug.width = atlases['char']['canvas'].width;
                debug.height = atlases['char']['canvas'].height;
                if (ctx)
                    ctx.drawImage(atlases['char']['canvas'], 0, 0)
            });

            charAnimatior.loadSpritesData();
            character.addCharacter({ pos: { x: 40, y: 20 }, enterPortal: false });

            engine.on('everyFrame', () => {

                if (editor.running()) {
                    //console.log('editor not running');
                }
                editor.editorProcessUserAnimation(world.getUsers()[0]);

                //engine.programData.char.updateTransformPart(window['data'], charDefinitions);

                // DRAW CHARS
                gl.useProgram(programData['char'].program);
                gl.activeTexture(gl.TEXTURE0 + charDrawer.atlasIndex);
                gl.activeTexture(gl.TEXTURE0 + charDrawer.normalIndex);
                gl.bindVertexArray(programData['char'].vao);
                gl.bindBuffer(gl.ARRAY_BUFFER, programData['char'].transformBuffer);
                gl.bufferSubData(gl.ARRAY_BUFFER, 0, programData['char'].transformData);
                gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 1 * engine.countOfCharProps);
                gl.bindVertexArray(null);
                // END DRAW CHARS

                floatingTime += 0.001;
            });

            editor.register();

            // Sidebar resize functionality
            const sidebar = document.getElementById('sidebar');
            const resizeHandle = sidebar?.querySelector('.resize-handle');
            if (sidebar && resizeHandle) {
                // Load saved width from localStorage
                const savedWidth = localStorage.getItem('editor-sidebar-width');
                if (savedWidth && parseInt(savedWidth) > 0) {
                    document.body.style.setProperty('--col1', savedWidth + 'px');
                }

                let isResizing = false;

                resizeHandle.addEventListener('mousedown', (e) => {
                    isResizing = true;
                    resizeHandle.classList.add('dragging');
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isResizing) return;
                    const newWidth = Math.max(100, e.clientX); // Minimum 100px
                    document.body.style.setProperty('--col1', newWidth + 'px');
                });

                document.addEventListener('mouseup', () => {
                    if (isResizing) {
                        isResizing = false;
                        resizeHandle.classList.remove('dragging');
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';
                        // Save width to localStorage
                        const currentWidth = parseInt(
                            getComputedStyle(document.body).getPropertyValue('--col1')
                        ) || 275;
                        localStorage.setItem('editor-sidebar-width', currentWidth.toString());
                    }
                });
            }

            // Panel resize functionality (generic - works for ANY panel with .panel-resize-handle)
            document.querySelectorAll('.panel').forEach(panel => {
                const resizeHandle = panel.querySelector('.panel-resize-handle');
                if (!resizeHandle) return;

                let isResizing = false;
                let startY = 0;
                let startHeight = 0;

                resizeHandle.addEventListener('mousedown', (e) => {
                    isResizing = true;
                    startY = e.clientY;
                    startHeight = panel.offsetHeight;
                    resizeHandle.classList.add('dragging');
                    document.body.style.cursor = 'ns-resize';
                    document.body.style.userSelect = 'none';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isResizing) return;
                    const diff = e.clientY - startY; // Dragging down = taller
                    const newHeight = Math.max(100, startHeight + diff);
                    panel.style.height = newHeight + 'px';
                });

                document.addEventListener('mouseup', () => {
                    if (isResizing) {
                        isResizing = false;
                        resizeHandle.classList.remove('dragging');
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';
                    }
                });
            });

        })();

    </script>
</body>

</html>

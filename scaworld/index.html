<style>
    @font-face {
        font-family: 'customFont';
        src: url('/Kingthings_Exeter.ttf');
    }

    * {
        image-rendering: pixelated;
        box-sizing: border-box;
        margin: 0;
    }

    html,
    body,
    canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        transform: scale(1) translateZ(0);
        will-change: transform;
        backface-visibility: hidden;
        perspective: 1px;
    }

    canvas {
        display: block;
        image-rendering: pixelated !important;
        /* Modern browsers */
        image-rendering: crisp-edges;
        /* Firefox */
        image-rendering: -webkit-optimize-contrast;
        /* Safari */
        image-rendering: -moz-crisp-edges;
        /* Firefox */
        image-rendering: -o-crisp-edges;
        /* Opera */
        transform: translateZ(0);
        /* Força o CEF a usar escala exata */
        will-change: transform;
        /* Otimização para CEF */
    }

    .html-main {
        width: 100%;
        height: 100%;
    }

    .html-canvas {
        width: 100%;
        height: 100%;
    }

    .layer {
        position: absolute;
        top: 0;
        left: 0;
    }

    .element {
        position: absolute;
        background-size: 100% 100%;
    }

    .element.canvas {
        width: 100%;
        height: 100%;
    }

    .floor {
        width: 100%;
        height: 100%;
        /*background-image: url(/chao.png);
        background-size: auto 15px;
        background-repeat: repeat-x;
        background-position: right 145px;*/
    }

    .water {
        width: 100%;
        height: 100%;
        top: 12px;
        background-image: url(/agua/agua-parada.png);
    }

    .fps {
        top: 0;
        color: red;
    }

    .time {
        top: 0;
        left: 30px;
        color: red;
    }

    .size {
        top: 30px;
        color: red;
    }

    #uiCanvas {
        position: relative;
    }

    #parts-data input[type="number"] {
        max-width: 60px;
    }

    #ending {
        position: absolute;
        top: 0%;
        left: 50%;
        transform: translate(-50%, 0%);
        font-family: 'customFont', cursive;
        font-size: 48px;
        color: white;
        text-shadow: 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000;
        max-width: 900;
        max-height: 500;
        text-align: center;
    }

    #ending-body {
        top: 900px;
        position: relative;
        text-align: center;
        position: relative;
        white-space: nowrap;
    }

    .ending-text {
        position: relative;
        left: 50%;
        width: fit-content;
        transform: translateX(-50%);
    }
</style>

    (async () => {

            world.process();
            //character.process();
            //elements.process();

            const atlas = atlases['world_background'];
            const size = { w: atlas.canvas.width, h: atlas.imageHeight };

            const data = [];

            const qtdToFillWidth = Math.ceil(canvas.width / size.w);
            const qtdToFillHeight = Math.ceil(canvas.height / size.h) + 1;

            const bgQtd = qtdToFillHeight * qtdToFillWidth;

            for (let x = 0; x < qtdToFillWidth; x++) {
                for (let y = 0; y < qtdToFillHeight; y++) {
                    data.push(x * size.w); // x
                    data.push((y * size.h) - canvas.height);//window['bg']); // y
                }
            }

            programData.background.transformData = new Float32Array(data);

            backgroundFBO.clearAndListen();

            // DRAW BACKGROUND
            gl.useProgram(programData.background.program);
            gl.activeTexture(gl.TEXTURE0 + backgroundDrawer.atlasIndex);
            gl.uniform1f(programData.background.locals.u.timeFactor, (world.time.hour / 12 > 1 ? (((world.time.hour / 12) - 2) * -1) : world.time.hour / 12));
            gl.bindVertexArray(programData.background.vao);
            gl.bindBuffer(gl.ARRAY_BUFFER, programData.background.transformBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, programData.background.transformData, gl.DYNAMIC_DRAW);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, programData.background.transformData);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, bgQtd/*3*/);
            gl.bindVertexArray(null);
            // END DRAW BACKGROUND
            backgroundFBO.unbind();

            // CENARIO FBO
            propCenarioFBO.clearAndListen();
            // CENARIO FBO

            // DRAW PROPS
            gl.useProgram(programData.prop.program);
            gl.activeTexture(gl.TEXTURE0 + propDrawer.atlasIndex);
            gl.activeTexture(gl.TEXTURE0 + propDrawer.normalIndex);
            gl.bindVertexArray(programData.prop.vao);
            gl.bindBuffer(gl.ARRAY_BUFFER, programData.prop.transformBuffer);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, programData.prop.transformData);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, 6 * world.getElements().length, 1);
            gl.bindVertexArray(null);
            // END DRAW PROPS

            // DRAW DYPROPS
            /**/gl.useProgram(programData.dyprop.program);
            gl.activeTexture(gl.TEXTURE0 + dyPropDrawer.atlasIndex);
            gl.bindVertexArray(programData.dyprop.vao);

                /**/lightFBO.clearAndListen();
                gl.enable(gl.BLEND);
                gl.blendFunc(gl.ONE, gl.ONE);
                gl.useProgram(programData.light.program);
                gl.activeTexture(gl.TEXTURE0 + propCenarioFBO.normalIndex);
                gl.bindTexture(gl.TEXTURE_2D, propCenarioFBO.normal);
                gl.activeTexture(gl.TEXTURE0 + propCenarioFBO.objectInfoIndex);
                gl.bindTexture(gl.TEXTURE_2D, propCenarioFBO.objectInfo);
                gl.bindVertexArray(programData.light.vao);

                gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, world.getLightCount());
                gl.bindVertexArray(null);
                lightFBO.unbind();
                gl.disable(gl.BLEND);
                gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            }

            // RIO FBO
            cenarioFBO.clearAndListen();
            // RIO FBO

            gl.useProgram(programData.cenario.program);
            gl.uniform3f(programData.cenario.locals.u.globalLightPosition, engine.globalLight.x, engine.globalLight.y, engine.globalLight.z);

            gl.enable(gl.BLEND);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            gl.disable(gl.BLEND);
            gl.bindTexture(gl.TEXTURE_2D, null);
            gl.bindVertexArray(null);

            // END RIO FBO
            cenarioFBO.unbind();

            gl.enable(gl.BLEND);
            gl.activeTexture(gl.TEXTURE0 + cenarioFBO.textureIndex);
            gl.bindTexture(gl.TEXTURE_2D, cenarioFBO.texture);

            gl.useProgram(programData.raw.program);
            // gl.activeTexture(gl.TEXTURE0 + cenarioDrawer.normalIndex);
            // gl.bindTexture(gl.TEXTURE_2D, cenarioDrawer.normal);
            gl.bindVertexArray(cenarioDrawer.vao);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            gl.bindVertexArray(null);

            // Transformar o rio
            const parse = (pos) => {
                const x = (pos.x / engine.canvas.width) * 2 - 1;
                const y = (pos.y / engine.canvas.height) * 2 - 1;
                const w = (pos.w / engine.canvas.width) * 2 - 1;
                const h = (pos.h / engine.canvas.height) * 2 - 1;
                return { x: x, y: y, w: w, h: h };
            }

            const parseImage = (pos) => {
                const x = (pos.x / engine.canvas.width);
                const y = (pos.y / engine.canvas.height);
                const w = (pos.w / engine.canvas.width);
                const h = (pos.h / engine.canvas.height);
                return { x: x, y: y, w: w, h: h };
            }

            let { pos, image } = riodefs;
            //pos.h = pos.h - canvas.height;
            //pos = parse(pos);
            //image = parse(image);

            image = { ...image };

            image.w = pos.w;
            image.h = image.h + image.y;

            image.y = image.h ^ image.y;
            image.h = image.h ^ image.y;

            const nPos = parse(pos);
            const nImage = parseImage(image);

            /// Transformar o rio
            // DESENHAR O RIO
            gl.useProgram(programData.rio.program);
            gl.uniform1f(programData.rio.locals.u.time, floatingTime);
            gl.activeTexture(gl.TEXTURE0 + cenarioFBO.textureIndex);
            gl.bindTexture(gl.TEXTURE_2D, cenarioFBO.texture);
            //gl.activeTexture(gl.TEXTURE0 + cenarioDrawer.normalIndex);
            //gl.bindTexture(gl.TEXTURE_2D, cenarioDrawer.normal);
            gl.bindVertexArray(rioDrawer.vao);

            programData.rio.transformData[0] = nPos.x;
            programData.rio.transformData[1] = nPos.h;
            programData.rio.transformData[2] = nImage.x;
            programData.rio.transformData[3] = nImage.h;

            programData.rio.transformData[4] = nPos.x;
            programData.rio.transformData[5] = nPos.y;
            programData.rio.transformData[6] = nImage.x;
            programData.rio.transformData[7] = nImage.y;

            programData.rio.transformData[8] = nPos.w;
            programData.rio.transformData[9] = nPos.h;
            programData.rio.transformData[10] = nImage.w;
            programData.rio.transformData[11] = nImage.h;

            programData.rio.transformData[12] = nPos.w;
            programData.rio.transformData[13] = nPos.y;
            programData.rio.transformData[14] = nImage.w;
            programData.rio.transformData[15] = nImage.y;

            gl.bindBuffer(gl.ARRAY_BUFFER, programData.rio.transformBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, programData.rio.transformData, gl.STATIC_DRAW);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            gl.disable(gl.BLEND);
            gl.bindTexture(gl.TEXTURE_2D, null);
            gl.bindVertexArray(null);

            floatingTime += 0.001;
        });

        if (executeWhenLoaded != null)
            //@ts-ignore
            executeWhenLoaded();
        executeWhenLoaded = () => { };
    })();


    function startEnding() {
        const ending = document.getElementById('ending');
        const endingBody = document.getElementById('ending-body');

        const ps = endingBody.querySelectorAll('p');
        for (let i = 0; i < ps.length; i++) {
            const p = ps[i];
            p.style.fontSize = `${3 + (i * 0.4)}cm`;
        }
        let currentPos = 15;
        let reduce = 0.003;

        setInterval(() => {
            if (currentPos > -1.2) {
                currentPos -= 0.018;
                endingBody.style.top = `${currentPos}cm`;
            } else {
                reduce = 0.0045;
            }

            for (let i = 0; i < ps.length; i++) {
                const p = ps[i];
                p.style.fontSize = `${parseFloat(p.style.fontSize.replace('cm', '')) - reduce}cm`;
            }
        }, 1000 / 60);
    }

    function createEndingText(data) {
        const endingBody = document.getElementById('ending-body');
        endingBody.innerHTML = '';
        const s = data.statistics;

        const addtext = (...args) => {
            const p = document.createElement('p');
            p.classList.add('ending-text');
            args.forEach(a => {
                const span = document.createElement('span');
                span.innerHTML = a;
                p.appendChild(span);
                p.appendChild(document.createElement('br'));
            })
            endingBody.appendChild(p);
        }

        addtext("TUDUM!");

        addtext(`Com um total de`, `${s.total_messages_count} mensagens!`);
        addtext(`Com um balanço de like/hate de`, `<b style="color: green;">${s.likes.total}</b>/<b style="color: red;">${s.hates.total}</b>`);

        const f = Object.getOwnPropertyNames(s.follows);
        if (f.length > 0) {
            addtext(`Obrigado aos novos followers: `)
            f.forEach(userId => {
                addtext(`${s.follows[userId].name}`);
            });
        }

        const r = Object.getOwnPropertyNames(s.raids);
        if (r.length > 0) {
            addtext(`Obrigado a raid de: `)
            r.forEach(userId => {
                addtext(`${s.raids[userId].name} com ${s.raids[userId].count} viewers`);
            });
        }

        const mmc = Object.getOwnPropertyNames(s.user_messages_count);
        if (mmc.length > 0) {
            const moreMessagesCount = mmc
                .map(id => { return { id: id, count: s.user_messages_count[id] } })
                .reduce((prev, current) => prev.count > current.count ? prev : current);
            const userWithMoreMessages = s.users[moreMessagesCount.id];
            if (userWithMoreMessages)
                addtext(`O maior mensageiro sendo: `, `${userWithMoreMessages.name} com ${moreMessagesCount.count} Mensagens`);
        }

        const mlc = Object.getOwnPropertyNames(s.likes.users);
        if (mlc.length > 0) {
            const moreLikesCount = mlc
                .map(id => { return { id: id, count: s.likes.users[id].count } })
                .reduce((prev, current) => prev.count > current.count ? prev : current);
            const userWithMoreLikes = s.users[moreLikesCount.id];
            if (userWithMoreLikes)
                addtext(`Obrigado a ${userWithMoreLikes.name}`, `pelos ${moreLikesCount.count} likes!`);
        }
        const mhc = Object.getOwnPropertyNames(s.hates.users);
        if (mhc.length > 0) {
            const moreHateCount = mhc
                .map(id => { return { id: id, count: s.hates.users[id].count } })
                .reduce((prev, current) => prev.count > current.count ? prev : current);
            const userWithMoreHate = s.users[moreHateCount.id];
            if (userWithMoreHate)
                addtext(`E ban no ${userWithMoreHate.name}`, `pelos ${moreHateCount.count} hates!`);
        }


        const mwb = Object.getOwnPropertyNames(s.wanted_bans);
        if (mwb.length > 0) {
            const moreWantedBan = mwb
                .map(id => { return { id: id, count: s.wanted_bans[id].count } })
                .reduce((prev, current) => prev.count > current.count ? prev : current);
            const userMoreHated = s.users[moreWantedBan.id];
            if (userMoreHated)
                addtext(`Com o mais odiado da live sendo ${userMoreHated.name}`, `sofrendo ${moreWantedBan.count} tentativas de ban!`);
        }
        const mb = Object.getOwnPropertyNames(s.bans);
        if (mb.length > 0) {
            const moreBanned = mb
                .map(id => { return { id: id, count: s.bans[id].count, name: s.bans[id].name } })
                .reduce((prev, current) => prev.count > current.count ? prev : current);
            if (moreBanned)
                addtext(`O mais sofrido da live sendo ${moreBanned.name}`, `sofrendo ${moreBanned.count} bans!`);
        }

        addtext(`Com a participação de: `)
        Object.getOwnPropertyNames(s.users).forEach(userId => {
            if (s.user_messages_count[userId]) {
                addtext(`${s.users[userId].name} com ${s.user_messages_count[userId]} mensagens`);
                return;
            }
            addtext(`${s.users[userId].name}`);
        });

        addtext(`E com mensagens especiais como:`);
        s.special_messages.forEach(message => {
            addtext(`${message}`);
        });
    }

</script>
